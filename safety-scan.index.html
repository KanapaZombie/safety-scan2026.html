}

.\[overflow-wrap\:anywhere\] {
  overflow-wrap: anywhere;
}

:root{
  --bg:#000000;
  --surface:#070707;
  --surface-2:#111111;
  --text:#ffffff;
  --muted:#cccccc;
  --yellow:#ffd400;
  --green:#d8e83c;
  --orange:#ff8a00;
  --red:#ff3b30;
  --line:#ffd400;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --surface:#070707;
    --surface-2:#111111;
    --text:#ffffff;
    --muted:#cccccc;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:#000;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
}

.impact{
  font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
}

.yellow-box{
  border:2px solid var(--yellow);
  border-radius:0;
}

.scan-line{
  position:absolute;
  left:0;
  right:0;
  height:3px;
  background:var(--yellow);
  box-shadow:0 0 18px var(--yellow);
  animation:scan 1.1s ease-in-out infinite alternate;
}

@keyframes scan{
  from{
    top:4%;
  }

  to{
    top:92%;
  }
}

@keyframes pulseBar{
  from{
    width:8%;
  }

  to{
    width:100%;
  }
}

.progress-fill{
  animation:pulseBar 2.4s linear forwards;
}

pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

input,select,textarea{
  color:#fff;
  background:#000;
}

input:focus,select:focus,textarea:focus{
  outline:2px solid var(--yellow);
  outline-offset:1px;
}

::-moz-selection{
  background:var(--yellow);
  color:#000;
}

::selection{
  background:var(--yellow);
  color:#000;
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:inline-flex {
    display: inline-flex;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-14 {
    padding-top: 3.5rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-\[220px_1fr\] {
    grid-template-columns: 220px 1fr;
  }
}
